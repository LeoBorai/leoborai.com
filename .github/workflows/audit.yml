name: Audit
on:
  pull_request:
  push:
    branches:
      - 'main'
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    name: cargo audit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit Vulnerabilities
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
