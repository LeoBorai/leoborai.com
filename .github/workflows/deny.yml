name: Deny
on:
  pull_request:
  push:
    branches:
      - 'main'
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-latest
    name: cargo deny
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check advisories, bans, licenses and sources
        uses: EmbarkStudios/cargo-deny-action@v2
