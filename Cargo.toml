[package]
name = "site"
version = "0.6.0"
edition = "2024"
authors = ["Leo Borai <estebanborai@gmail.com>"]
build = "build.rs"

[dependencies]
anyhow = "1.0.75"
chrono = { version = "0.4.31", features = ["serde"] }
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "signals", "hooks"] }
dioxus-ssr = "0.7"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.104"
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
thiserror = "1.0.48"
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
serde_yaml_ng = "0.10"

[build-dependencies]
sha2 = "0.10"
ureq = "3"
