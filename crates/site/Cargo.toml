[package]
name = "site"
version = "0.1.0"
edition = "2024"
authors = ["Leo Borai <estebanborai@gmail.com>"]
build = "build.rs"

[[bin]]
name = "site"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.75"
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "signals", "hooks"] }
dioxus-ssr = "0.7"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

notes = { path = "../notes" }
skills = { path = "../skills" }

[build-dependencies]
ureq = "3"
sha2 = "0.10"
